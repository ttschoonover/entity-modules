parameters:
  republic.motto:
    value: "Room for one more"
    type: string
    changed_by: constitutional
    group: The Republic
    describe: The motto of the Republic, shown on its website under its name.
  republic.short_name:
    value: ""
    type: string
    changed_by: constitutional
    group: The Republic
    describe: The name used in running text, with its article if it takes one (for example "the Virtual Democratic Republic"). Empty means "the" followed by the full name.
  republic.privacy_contact:
    value: ""
    type: string
    changed_by: organic
    group: The Republic
    describe: An email address or page where people send questions and requests about their personal data. Shown on the privacy page.
  republic.min_age:
    value: 16
    type: integer
    min: 13
    max: 21
    changed_by: constitutional
    group: The Republic
    describe: The youngest age at which a person may become a citizen. The website asks applicants to confirm it. 16 meets the strictest age of digital consent in the EU; it may not go below 13.
